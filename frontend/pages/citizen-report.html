<!DOCTYPE html>
<html lang="en">
<head>
  <title>Citizen Reporting Portal - MargDarshak</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="container py-4">
    <h2 class="fw-bold mb-4 gradient-text">Smart Citizen Reporting</h2>
    <a href="dashboard.html" class="btn btn-outline-info mb-4">&larr; Return to Dashboard</a>
    
    <div class="row">
      <div class="col-md-5 mb-4">
        <div class="card p-4 h-100 shadow-sm glass-card border-info border-opacity-25" style="max-width:100%">
          <h5 class="mb-3 text-info">Submit Issue Report</h5>
          <form id="citizenForm">
            <div class="mb-3">
              <label class="form-label text-muted">Issue Type</label>
              <select class="form-select premium-input" id="cIssueType" required>
                <option value="pothole">Pothole / Road Damage</option>
                <option value="signal_failure">Traffic Signal Failure</option>
                <option value="accident">Accident</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted">Problem Description <button type="button" class="btn btn-sm btn-outline-info ms-2" onclick="startVoiceRecording()"><i class="bi bi-mic"></i> Voice Input</button></label>
              <textarea class="form-control premium-input" id="cDesc" rows="3" placeholder="Examples: Deep pothole on main road, Broken Traffic Light..." required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted">Incident Image Upload</label>
              <input type="file" class="form-control premium-input" id="cImage" accept="image/*">
            </div>
            <div class="mb-4 p-3 bg-dark bg-opacity-25 rounded border border-secondary">
              <small class="text-muted d-block mb-1">Click map to set precise location:</small>
              <code id="cLoc" class="text-info fs-6">Lat: 28.6139, Lng: 77.2090</code>
            </div>
            <button type="submit" class="btn btn-primary glow-btn w-100">Upload to Database</button>
          </form>
        </div>
      </div>
      <div class="col-md-7 mb-4">
        <div class="card p-3 shadow-lg glass-card h-100" style="max-width:100%">
          <div id="portalMap" class="map-container"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let map = L.map('portalMap').setView([28.6139, 77.2090], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let markerLayer = L.layerGroup().addTo(map);
    
    let currentLat = 28.6139, currentLng = 77.2090;
    let selectedMarker = L.marker([currentLat, currentLng], {draggable: true}).addTo(map);
    
    selectedMarker.on('dragend', function(e) {
       currentLat = e.target.getLatLng().lat; currentLng = e.target.getLatLng().lng;
       document.getElementById('cLoc').innerText = `Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}`;
    });

    map.on('click', (e) => {
      currentLat = e.latlng.lat; currentLng = e.latlng.lng;
      selectedMarker.setLatLng([currentLat, currentLng]);
      document.getElementById('cLoc').innerText = `Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}`;
    });

    async function loadReports() {
      const res = await authFetch('/citizen/report');
      if (res.ok) {
        const data = await res.json();
        markerLayer.clearLayers();
        data.forEach(r => {
          let mark = L.circleMarker([r.location.lat, r.location.lng], {radius: 7, fillColor: 'cyan', color: '#000', opacity: 0.8, fillOpacity: 0.8})
           .addTo(markerLayer);
          
          let popupHTML = r.image ? `<img src="https://margdarshak-ai-4rdt.onrender.com${r.image}" width="150" class="mb-2 rounded"><br>` : '';
          mark.bindPopup(popupHTML + `<span class="text-dark">${r.description}</span>`);
        });
      }
    }
    loadReports();

    document.getElementById('citizenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('issueType', document.getElementById('cIssueType').value);
      formData.append('description', document.getElementById('cDesc').value);
      formData.append('lat', currentLat);
      formData.append('lng', currentLng);
      const fileInput = document.getElementById('cImage');
      if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

      const token = localStorage.getItem('token');
      try {
        const res = await fetch(`${API_BASE_URL}/citizen/report`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }, // Form Data doesn't need Content-Type JSON
          body: formData
        });
        if (res.ok) {
          alert('Public report submitted seamlessly!');
          document.getElementById('cDesc').value = '';
          fileInput.value = '';
        } else {
          alert('Error attaching report to grid.');
        }
      } catch(e) {
          console.error(e);
      }
    });

    const socket = io('https://margdarshak-ai-4rdt.onrender.com');
    socket.on('newCitizenReport', () => loadReports());
    
    // Voice-Based Reporting logic
    function startVoiceRecording() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Your browser doesn't support speech recognition.");
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      
      recognition.onstart = function() {
        document.getElementById('cDesc').placeholder = "Listening...";
      };
      
      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        const currentText = document.getElementById('cDesc').value;
        document.getElementById('cDesc').value = currentText ? currentText + " " + text : text;
      };
      
      recognition.onerror = function(event) {
        console.error("Speech recognition error", event.error);
        alert("Microphone error. Please try again.");
      };
      
      recognition.start();
    }
  </script>

    <!-- Professional Footer -->
    <footer class="footer mt-auto py-3 bg-dark text-white text-center border-top border-secondary border-opacity-25 w-100" style="position: relative; z-index: 10; margin-top: auto;">
        <div class="container">
            <span class="text-muted" style="font-size: 0.9rem;">&copy; 2026 | Developed by DeepQNova Pvt. Ltd.</span>
        </div>
    </footer>
</body>
</html>
