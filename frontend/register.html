<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MargDarshak AI - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold gradient-text">MargDarshak AI</h2>
        <p class="text-muted">Create an account to join the network.</p>
      </div>
      <form id="registerForm">
        <div id="registerAlert" class="alert d-none" role="alert"></div>
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control premium-input" id="name" required placeholder="John Doe">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control premium-input" id="email" required placeholder="name@example.com">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control premium-input" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 glow-btn" id="registerBtn">Create Account</button>
      </form>
      <div class="text-center mt-4">
        <p class="mb-0 text-muted">Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>

    <!-- Professional Footer -->
    <footer class="footer mt-auto py-3 bg-dark text-white text-center border-top border-secondary border-opacity-25 w-100" style="position: relative; z-index: 10; margin-top: auto;">
        <div class="container">
            <span class="text-muted" style="font-size: 0.9rem;">&copy; 2026 | Developed by DeepQNova Pvt. Ltd.</span>
        </div>
    </footer>
</body>
</html>
