<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MargDarshak AI - Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .auth-body-admin {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="auth-body-admin">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card glass-card p-4 p-md-5 border-danger">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-danger">Admin Portal</h2>
        <p class="text-muted">Enter administrator credentials to proceed.</p>
      </div>
      <form id="adminLoginForm">
        <div id="loginAlert" class="alert d-none" role="alert"></div>
        <div class="mb-3">
          <label for="email" class="form-label form-label-light">Admin Email</label>
          <input type="email" class="form-control premium-input bg-dark text-light border-secondary" id="email" required placeholder="admin@margdarshak.gov">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label form-label-light">Password</label>
          <input type="password" class="form-control premium-input bg-dark text-light border-secondary" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-danger w-100 glow-btn" id="loginBtn">Authorize Access</button>
      </form>
      <div class="text-center mt-4">
        <p class="mb-0 text-muted"><a href="index.html" class="auth-link text-decoration-none">← Back to Portal Selection</a></p>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>

    <!-- Professional Footer -->
    <footer class="footer mt-auto py-3 bg-dark text-white text-center border-top border-secondary border-opacity-25 w-100" style="position: relative; z-index: 10; margin-top: auto;">
        <div class="container">
            <span class="text-muted" style="font-size: 0.9rem;">&copy; 2026 | Developed by DeepQNova Pvt. Ltd.</span>
        </div>
    </footer>
</body>
</html>
